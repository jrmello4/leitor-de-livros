name: Native release (rolling)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build signed APK and update native-latest
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TACTILE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Igual ao CI: sem `packages: ''` a action tenta instalar o pacote
      # legado `tools` (removido pelo Google) e o job morre no sdkmanager.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Segredos esperados (Settings → Secrets → Actions):
      #   TACTILE_KEY_BASE64      keystore .jks em base64
      #   TACTILE_STORE_PASSWORD  senha do keystore
      #   TACTILE_KEY_ALIAS       alias da chave
      #   TACTILE_KEY_PASSWORD    senha da chave
      - name: Require signing secrets
        shell: bash
        run: |
          for v in TACTILE_KEY_BASE64 TACTILE_STORE_PASSWORD TACTILE_KEY_ALIAS TACTILE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret $v — configure it in Settings → Secrets → Actions."
              exit 1
            fi
          done
        env:
          TACTILE_KEY_BASE64: ${{ secrets.TACTILE_KEY_BASE64 }}
          TACTILE_STORE_PASSWORD: ${{ secrets.TACTILE_STORE_PASSWORD }}
          TACTILE_KEY_ALIAS: ${{ secrets.TACTILE_KEY_ALIAS }}
          TACTILE_KEY_PASSWORD: ${{ secrets.TACTILE_KEY_PASSWORD }}

      - name: Decode keystore
        shell: bash
        working-directory: native
        run: echo "$TACTILE_KEY_BASE64" | base64 --decode > release.keystore
        env:
          TACTILE_KEY_BASE64: ${{ secrets.TACTILE_KEY_BASE64 }}

      - name: Build signed release APK
        shell: bash
        run: |
          export TACTILE_STORE_FILE="release.keystore"
          export TACTILE_STORE_PASSWORD="${{ secrets.TACTILE_STORE_PASSWORD }}"
          export TACTILE_KEY_ALIAS="${{ secrets.TACTILE_KEY_ALIAS }}"
          export TACTILE_KEY_PASSWORD="${{ secrets.TACTILE_KEY_PASSWORD }}"
          cd native && ./gradlew assembleRelease --no-daemon

      - name: Verify signature and collect APK
        id: apk
        shell: bash
        run: |
          APK=$(find native/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p release-artifacts
          cp "$APK" "release-artifacts/tactile-native-0.3.0.apk"
          echo "apk_name=tactile-native-0.3.0.apk" >> "$GITHUB_OUTPUT"

      - name: Publish native-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: "Native rolling (0.3.0+${{ github.run_number }})"
          body: |
            Rolling build from `main` — app Android nativo.

            - Version code: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - Install: download `${{ steps.apk.outputs.apk_name }}` e permita “Instalar apps desconhecidos”.
          prerelease: true
          make_latest: false
          files: |
            release-artifacts/${{ steps.apk.outputs.apk_name }}
