name: Native release (rolling)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build signed APK and update native-latest
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TACTILE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Igual ao CI: sem `packages: ''` a action tenta instalar o pacote
      # legado `tools` (removido pelo Google) e o job morre no sdkmanager.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform and build tools
        # Igual ao CI: sem o `yes | --licenses` (SIGPIPE/exit 141 e
        # redundante com o aceite do setup-android).
        shell: bash
        run: sdkmanager.bat "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Segredos reutilizados da era Tauri (Settings → Secrets → Actions):
      #   ANDROID_KEY_BASE64      keystore .jks em base64
      #   ANDROID_STORE_PASSWORD  senha do keystore
      #   ANDROID_KEY_ALIAS       alias da chave
      #   ANDROID_KEY_PASSWORD    senha da chave
      - name: Require signing secrets
        shell: bash
        run: |
          for v in ANDROID_KEY_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing secret $v — configure it in Settings → Secrets → Actions."
              exit 1
            fi
          done
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode keystore
        shell: bash
        working-directory: native
        run: echo "$ANDROID_KEY_BASE64" | base64 --decode > release.keystore
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}

      - name: Unit tests
        shell: bash
        working-directory: native
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Release lint
        shell: bash
        working-directory: native
        run: ./gradlew lintRelease --no-daemon

      - name: Debug APK
        shell: bash
        working-directory: native
        run: ./gradlew assembleDebug --no-daemon

      - name: Compile androidTest sources
        shell: bash
        working-directory: native
        run: ./gradlew compileDebugAndroidTestSources --no-daemon

      - name: Validate and build signed release APK
        shell: bash
        working-directory: native
        run: ./gradlew assembleRelease --no-daemon
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          TACTILE_STORE_FILE: release.keystore
          TACTILE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          TACTILE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TACTILE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Release metadata
        shell: bash
        working-directory: native
        run: ./gradlew generateReleaseMetadata --no-daemon
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          TACTILE_STORE_FILE: release.keystore
          TACTILE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          TACTILE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TACTILE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature and collect APK
        id: apk
        shell: bash
        run: |
          APK=$(find native/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --print-certs "$APK"
          if grep -q '"publishable": false' release-manifest.json; then
            echo "ERRO CRÍTICO: Artefato classificado como não-publicável (debug-signed) no workflow oficial de release!"
            exit 1
          fi
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          VERSION=$(python -c "import json; print(json.load(open('release-manifest.json'))['versionName'])")
          APK_NAME="tactile-native-${VERSION}.apk"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp "$APK" "release-artifacts/$APK_NAME"
          if [ -f "release-manifest.json" ]; then
            cp release-manifest.json release-artifacts/
          fi
          if [ -f "sbom.json" ]; then
            cp sbom.json release-artifacts/
          fi
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Move native-latest tag to the validated commit
        shell: bash
        run: git push --force origin "${GITHUB_SHA}:refs/tags/native-latest"

      - name: Publish native-latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: native-latest
          name: "Native rolling (${{ steps.apk.outputs.version_name }}+${{ github.run_number }})"
          body: |
            Rolling build from `main` — app Android nativo.

            - Version code: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`
            - Install: download `${{ steps.apk.outputs.apk_name }}` e permita “Instalar apps desconhecidos”.
          prerelease: true
          make_latest: false
          files: |
            release-artifacts/${{ steps.apk.outputs.apk_name }}
            release-artifacts/release-manifest.json
            release-artifacts/sbom.json
