name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, for example v0.1.0'
        required: true
        type: string
      allow_untested_runner:
        description: 'Publish even though this runner cannot launch and drive the installed app'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    # The release builds the installer twice: once for the smoke gate and once
    # for the artifact it publishes.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Every Rust job compiles the same tree from scratch and two of them also
      # build the installer, so caching the registry and target directory is the
      # difference between a twenty minute job and a short one.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The installer is named by the versions in the manifests, so a tag that
      # disagrees with them would publish an asset that does not match its
      # release.
      - name: Check the tag against the manifests
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node scripts/release/check-version.mjs "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Never publish a build that cannot install, import and resume. This is
      # the same isolated lifecycle the CI smoke job runs.
      # A hosted runner has no desktop session, so it usually cannot launch and
      # drive the installed app. That is not evidence about the build, so the
      # run is allowed to fail here and the gate below decides what it means.
      - name: Run installer smoke
        id: smoke
        continue-on-error: true
        env:
          SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/installer-smoke
        run: npm run test:installer-smoke

      - name: Decide whether the smoke evidence allows a release
        env:
          SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/installer-smoke
          ALLOW_UNTESTED_RUNNER: ${{ inputs.allow_untested_runner }}
        run: node scripts/release/gate-smoke.mjs

      - name: Upload installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-installer-smoke-evidence
          path: artifacts/installer-smoke/**

      - name: Build the release installer
        run: npm run tauri:build

      - name: Collect the installer and its checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          installer="src-tauri/target/release/bundle/nsis/Tactile Reader_${{ steps.version.outputs.version }}_x64-setup.exe"
          test -f "$installer"
          name="TactileReader_${{ steps.version.outputs.version }}_x64-setup.exe"
          cp "$installer" "artifacts/release/$name"
          ( cd artifacts/release && sha256sum "$name" > "$name.sha256" )
          cat "artifacts/release/$name.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tactile Reader ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows 10/11 x64. Download the installer below and run it.

            The installer is **not code signed**, so Windows SmartScreen shows
            "Windows protected your PC". Choose **More info → Run anyway** if you
            trust this download. Verify it first with the published checksum:

            ```powershell
            Get-FileHash .\TactileReader_${{ steps.version.outputs.version }}_x64-setup.exe -Algorithm SHA256
            ```

            Compare the result with the `.sha256` file attached to this release.

            Reading files and progress stay on the device. Uninstall from
            Windows Settings › Apps, or with the `uninstall.exe` in the install
            directory.
          files: |
            artifacts/release/*.exe
            artifacts/release/*.sha256
