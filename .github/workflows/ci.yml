name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --reporter=dot

      - name: Build frontend
        run: npm run build

      - name: Validate release scripts
        run: npm run test:release-scripts

      - name: Validate workflow structure
        run: npm run test:workflow

  native:
    name: Rust and Tauri Windows verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows installer
        run: npm run tauri build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactile-reader-windows-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  visual:
    name: Reader visual matrix evidence
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run visual matrix
        run: npm run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactile-reader-visual-evidence
          path: |
            artifacts/visual/**
            test-results/visual/**
          if-no-files-found: warn
          retention-days: 14

  installer-smoke:
    name: Windows installer smoke evidence
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run installer smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/installer-smoke
        run: npm run test:installer-smoke

      - name: Upload installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactile-reader-installer-smoke-evidence
          path: |
            artifacts/installer-smoke/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
