name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-app:
    name: Native app assemble and unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # O núcleo é Kotlin puro: sem Rust, sem NDK, sem .so por ABI.
      - name: Unit tests and APKs
        shell: bash
        run: cd native && ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Upload scaffold debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tactile-native-scaffold-debug
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
