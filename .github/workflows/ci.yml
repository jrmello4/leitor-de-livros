name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --reporter=dot

      - name: Build frontend
        run: npm run build

      - name: Enforce bundle budget
        run: npm run test:bundle-budget

      - name: Validate release scripts
        run: npm run test:release-scripts

      - name: Validate performance contract
        run: npm run test:performance-contract

      - name: Validate workflow structure
        run: npm run test:workflow

  native:
    name: Rust core verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust lint (app + portable core)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p tactile-reader -p tactile-core --all-targets --all-features -- -D warnings

      - name: Run Rust tests (app)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p tactile-reader

      - name: Run Rust tests (portable core)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p tactile-core

  native-app:
    name: Native scaffold assemble
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Assemble native scaffold (builds core .so via NDK)
        shell: bash
        run: |
          PREBUILT="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/windows-x86_64/bin"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export CC_aarch64_linux_android="$PREBUILT/aarch64-linux-android35-clang.cmd"
          export AR_aarch64_linux_android="$PREBUILT/llvm-ar.exe"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$PREBUILT/aarch64-linux-android35-clang.cmd"
          export CC_x86_64_linux_android="$PREBUILT/x86_64-linux-android35-clang.cmd"
          export AR_x86_64_linux_android="$PREBUILT/llvm-ar.exe"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$PREBUILT/x86_64-linux-android35-clang.cmd"
          cd native && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

  visual:
    name: Reader visual matrix evidence
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run visual matrix
        run: npm run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tactile-reader-visual-evidence
          path: |
            artifacts/visual/**
            test-results/visual/**
          if-no-files-found: warn
          retention-days: 14
