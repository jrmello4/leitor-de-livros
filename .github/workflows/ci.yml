name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-app:
    name: Native app assemble and unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O pacote legado `tools` foi removido do repositório do Google: sem
      # `packages: ''` a action tenta `sdkmanager tools` e falha com exit 1.
      # platform-tools/platforms/build-tools vêm do passo manual abaixo.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install platform and build tools
        # `yes | sdkmanager --licenses` morre com SIGPIPE (exit 141) sob
        # pipefail — e é redundante: o setup-android já aceita as licenças.
        shell: bash
        run: sdkmanager.bat "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # O núcleo é Kotlin puro: sem Rust, sem NDK, sem .so por ABI.
      - name: Unit tests, androidTest compilation and release build
        shell: bash
        run: cd native && ./gradlew testDebugUnitTest compileDebugAndroidTestSources assembleRelease generateReleaseMetadata --no-daemon

      - name: Upload release APK and manifest
        uses: actions/upload-artifact@v7
        with:
          name: tactile-native-release
          path: |
            native/app/build/outputs/apk/release/*.apk
            release-manifest.json
            sbom.json
          if-no-files-found: error
          retention-days: 14
