name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --reporter=dot

      - name: Build frontend
        run: npm run build

      - name: Enforce bundle budget
        run: npm run test:bundle-budget

      - name: Validate release scripts
        run: npm run test:release-scripts

      - name: Validate performance contract
        run: npm run test:performance-contract

      - name: Validate workflow structure
        run: npm run test:workflow

  native:
    name: Rust core verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  visual:
    name: Reader visual matrix evidence
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run visual matrix
        run: npm run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tactile-reader-visual-evidence
          path: |
            artifacts/visual/**
            test-results/visual/**
          if-no-files-found: warn
          retention-days: 14
