[package]
name = "tactile-reader"
version = "0.1.0"
description = "A local-first tactile comic reader"
authors = ["Tactile Reader"]
edition = "2021"

[lib]
name = "tactile_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
