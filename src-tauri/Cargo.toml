[package]
name = "tactile-reader"
version = "0.1.0"
description = "A local-first tactile comic reader"
authors = ["Tactile Reader"]
edition = "2021"

[lib]
name = "tactile_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["image_latest", "pdfium_7881", "thread_safe"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
unrar = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The reader ships as a single Windows installer, so the release build is
# optimised for the artifact a reader downloads rather than for build time.
[profile.release]
codegen-units = 1
lto = true
strip = true
