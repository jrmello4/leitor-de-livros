[package]
name = "tactile-core"
version = "0.1.1"
description = "Portable library core for Tactile Reader: SQLite library, archive importers (CBZ/CBR/7z), derived page cache. No UI, no Tauri, no PDF runtime — hosts inject a PDF backend via archive::set_pdf_backend."
authors = ["Tactile Reader"]
edition = "2021"
license = "MIT"

[lib]
name = "tactile_core"
# cdylib ships as libtactile_core.so inside the native Android app (JNI).
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"] }
jni = { version = "0.21", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = { version = "0.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
unrar = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
# Pure Rust RAR4/RAR5 reader: avoids shipping an external executable or a C++
# runtime in the APK. The Rust crypto backend also cross-compiles with the NDK.
unrar-rs = { version = "0.10.3", default-features = false, features = ["crypto-rust"] }
